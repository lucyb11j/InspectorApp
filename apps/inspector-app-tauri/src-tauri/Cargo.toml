[package]
name = "inspecos-tauri-app"
version = "1.0.0"
description = "InspecOS — Aplicación Nativa Offline de Inspección Técnica Inmobiliaria (Tauri v2 + SQLite + Cloudflare R2)"
authors = ["InspecOS Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]

